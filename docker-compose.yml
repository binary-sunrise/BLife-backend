services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bliffe-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bliffe-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bliffe-worker
    restart: unless-stopped
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bliffe-net

  redis:
    image: redis:7-alpine
    container_name: bliffe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bliffe-net

volumes:
  redis_data:
    driver: local

networks:
  bliffe-net:
    driver: bridge
