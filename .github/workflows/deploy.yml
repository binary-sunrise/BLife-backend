name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
      - refactor_BE
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate Deployment ZIP Package
        run: |
          zip -r deploy.zip . \
            -x "*.git*" \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "tests/*" \
            -x ".pytest_cache/*" \
            -x ".ruff_cache/*" \
            -x ".mypy_cache/*"

      - name: Upload to S3 & Deploy to Beanstalk
        run: |
          VERSION_LABEL="backend-${{ github.sha }}-${{ github.run_number }}"
          S3_BUCKET=$(aws elasticbeanstalk create-storage-location --output text --query "S3Bucket")
          S3_KEY="bliffe-backend/${VERSION_LABEL}.zip"

          echo "Uploading package to s3://${S3_BUCKET}/${S3_KEY}..."
          aws s3 cp deploy.zip "s3://${S3_BUCKET}/${S3_KEY}"

          echo "Creating Application Version ${VERSION_LABEL}..."
          aws elasticbeanstalk create-application-version \
            --application-name bliffe-backend \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${S3_BUCKET}",S3Key="${S3_KEY}" \
            --auto-create-application

          echo "Updating Environment bliffe-backend-prod..."
          aws elasticbeanstalk update-environment \
            --environment-name bliffe-backend-prod \
            --version-label "${VERSION_LABEL}"

          echo "Waiting for environment update to complete..."
          aws elasticbeanstalk wait environment-updated \
            --environment-name bliffe-backend-prod

          echo "Deployment successfully completed!"
